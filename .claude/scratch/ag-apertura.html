:root {
  --bg: #0b0a08;
  --bg-2: #141210;
  --fg: #f3ede4;
  --fg-muted: #a89e8f;
  --accent: #b5652d;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--fg);
  font-family: 'Space Grotesk', ui-sans-serif, sans-serif;
  overflow: hidden;
}

.stage {
  position: fixed;
  inset: 0;
  overflow: hidden;
}

/* ---------- Hero (revealed state) ---------- */

.hero {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: clamp(1.5rem, 4vw, 3rem);
  padding: 6vh 6vw;
  text-align: center;
}

.hero__mark {
  margin: 0;
  font-family: 'Fraunces Display', serif;
  font-style: italic;
  font-weight: 600;
  font-size: clamp(2.75rem, 9vw, 6.5rem);
  letter-spacing: -0.01em;
  text-wrap: balance;
}

.hero__stage {
  position: relative;
  width: min(72vw, 560px);
  height: min(60vh, 560px);
  display: flex;
  align-items: center;
  justify-content: center;
  perspective: 1400px;
}

.hero__glow {
  position: absolute;
  inset: 8%;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(181, 101, 45, 0.28) 0%, rgba(181, 101, 45, 0.08) 45%, transparent 72%);
  filter: blur(2px);
  pointer-events: none;
}

.hero__product {
  position: relative;
  max-width: 82%;
  max-height: 82%;
  object-fit: contain;
  transform-style: preserve-3d;
  transition: transform 150ms ease-out;
  filter: drop-shadow(0 30px 40px rgba(0, 0, 0, 0.55));
  will-change: transform;
}

.hero__tagline {
  margin: 0;
  max-width: 36ch;
  font-size: clamp(0.95rem, 1.6vw, 1.15rem);
  line-height: 1.6;
  color: var(--fg-muted);
  text-wrap: balance;
}

/* ---------- Doors ---------- */

.doors {
  position: absolute;
  inset: 0;
  z-index: 20;
  pointer-events: none;
}

.door {
  position: absolute;
  inset-block: 0;
  width: 50%;
  background: var(--bg);
  transition: transform 900ms cubic-bezier(0.83, 0, 0.17, 1);
}

.door--left { left: 0; transform: translateX(0); }
.door--right { right: 0; transform: translateX(0); }

.doors.is-open .door--left { transform: translateX(-100%); }
.doors.is-open .door--right { transform: translateX(100%); }

/* ---------- Loader content ---------- */

.loader {
  position: absolute;
  inset: 0;
  z-index: 21;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: clamp(1.25rem, 3vw, 2rem);
  opacity: 1;
  transition: opacity 320ms ease-out;
}

.loader.is-hidden {
  opacity: 0;
  pointer-events: none;
}

.loader__mark {
  margin: 0;
  font-family: 'Fraunces Display', serif;
  font-style: italic;
  font-weight: 600;
  font-size: clamp(2.25rem, 6vw, 3.75rem);
}

.loader__product-wrap {
  position: relative;
  width: clamp(6.5rem, 12vw, 9rem);
  height: clamp(8rem, 15vw, 11rem);
  display: flex;
  align-items: center;
  justify-content: center;
}

.loader__product {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  filter: brightness(0.94) drop-shadow(0 18px 22px rgba(0, 0, 0, 0.5));
}

.loader__counter {
  margin: 0;
  font-variant-numeric: tabular-nums;
  font-size: 0.85rem;
  letter-spacing: 0.32em;
  color: var(--fg-muted);
}

/* ---------- Replay control (demo-only) ---------- */

.replay {
  position: fixed;
  right: 1.25rem;
  bottom: 1.25rem;
  z-index: 30;
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.6rem 1rem;
  border-radius: 999px;
  border: 1px solid rgba(243, 237, 228, 0.18);
  background: rgba(20, 18, 16, 0.7);
  backdrop-filter: blur(6px);
  color: var(--fg-muted);
  font-family: 'Space Grotesk', sans-serif;
  font-size: 0.78rem;
  letter-spacing: 0.04em;
  cursor: pointer;
}

.replay:hover { color: var(--fg); border-color: var(--accent); }
.replay:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {
  .door, .loader, .hero__product { transition-duration: 1ms !important; }
}
</style>

<button class="replay" id="replayBtn" type="button" aria-label="Reproducir la apertura de nuevo">↻ Ver de nuevo</button>

<script>
  var COUNT_MS = 2200;
  var DOOR_MS = 950;
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var doorsEl = document.getElementById('doors');
  var loaderEl = document.getElementById('loader');
  var counterEl = document.getElementById('counter');
  var heroStage = document.getElementById('heroStage');
  var heroProduct = document.getElementById('heroProduct');
  var replayBtn = document.getElementById('replayBtn');

  var raf = null;

  function playIntro() {
    if (raf) cancelAnimationFrame(raf);
    doorsEl.classList.remove('is-open');
    loaderEl.classList.remove('is-hidden');
    counterEl.textContent = '000%';

    if (reduced) {
      counterEl.textContent = '100%';
      requestAnimationFrame(function () {
        doorsEl.classList.add('is-open');
        loaderEl.classList.add('is-hidden');
      });
      return;
    }

    var start = performance.now();
    function tick(now) {
      var elapsed = now - start;
      var progress = Math.min(1, elapsed / COUNT_MS);
      counterEl.textContent = String(Math.round(progress * 100)).padStart(3, '0') + '%';
      if (progress < 1) {
        raf = requestAnimationFrame(tick);
      } else {
        doorsEl.classList.add('is-open');
        loaderEl.classList.add('is-hidden');
      }
    }
    raf = requestAnimationFrame(tick);
  }

  heroStage.addEventListener('mousemove', function (event) {
    var rect = heroStage.getBoundingClientRect();
    var px = (event.clientX - rect.left) / rect.width - 0.5;
    var py = (event.clientY - rect.top) / rect.height - 0.5;
    var tiltX = py * -10;
    var tiltY = px * 10;
    heroProduct.style.transform = 'rotateX(' + tiltX + 'deg) rotateY(' + tiltY + 'deg)';
  });

  heroStage.addEventListener('mouseleave', function () {
    heroProduct.style.transform = 'rotateX(0deg) rotateY(0deg)';
  });

  replayBtn.addEventListener('click', playIntro);

  playIntro();
</script>
